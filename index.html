<!DOCTYPE html>
<html lang="en">

<meta name="description" content="Jal Rakshak — sensor-driven water monitoring and purification system by Team Hexora." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07131b;--bg2:#0b1d27;--card:rgba(17,39,50,.72);--card2:#102b38;--text:#eef7f7;--muted:#91aab4;--teal:#55ead5;--teal2:#1fb7a5;--orange:#e97942;--green:#77d69a;--red:#ff8067;--line:rgba(238,247,247,.1);--shadow:0 24px 70px rgba(0,0,0,.32);--display:'Space Grotesk',sans-serif;--body:'DM Sans',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:radial-gradient(circle at 75% 0%,rgba(44,166,153,.14),transparent 28%),var(--bg);color:var(--text);font-family:var(--body);overflow-x:hidden}a{text-decoration:none;color:inherit}button{font:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(to bottom,black,transparent 85%);z-index:-1}
.container{width:min(1180px,calc(100% - 48px));margin:auto}.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(1120px,calc(100% - 32px));z-index:100;display:flex;align-items:center;justify-content:space-between;padding:13px 16px 13px 20px;border:1px solid var(--line);background:rgba(7,19,27,.72);backdrop-filter:blur(18px);border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.22)}.brand{font:700 15px var(--display);letter-spacing:.06em}.brand span{color:var(--teal)}.nav-links{display:flex;gap:7px}.nav-links a{font-size:12px;color:var(--muted);padding:8px 11px;border-radius:10px;transition:.25s}.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.06)}.status{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);color:var(--teal);letter-spacing:.06em}.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 14px var(--teal);animation:pulse 1.7s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(85,234,213,0)}}
.hero{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center;padding:130px 0 70px}.kicker{font:500 11px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:9px;margin-bottom:20px}.kicker:before{content:"";width:26px;height:1px;background:var(--teal)}h1,h2,h3{font-family:var(--display);line-height:1.03}h1{font-size:clamp(50px,7vw,88px);letter-spacing:-.045em;max-width:760px}h1 em{font-style:normal;background:linear-gradient(100deg,var(--orange),#fff 48%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:gradient 5s ease infinite}@keyframes gradient{50%{background-position:100%}}.hero-copy{color:var(--muted);font-size:16px;line-height:1.7;max-width:570px;margin-top:22px}.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:12px;padding:12px 17px;font-weight:600;font-size:13px;transition:.25s}.btn.primary{background:var(--teal);color:#06201d;border-color:var(--teal)}.btn.secondary{background:rgba(255,255,255,.035);color:var(--text)}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(0,0,0,.25)}
.hero-panel{position:relative;min-height:500px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(19,50,63,.88),rgba(8,25,34,.82));box-shadow:var(--shadow);overflow:hidden;padding:22px}.hero-panel:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(85,234,213,.1);filter:blur(45px);right:-80px;top:-80px}.panel-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:11px var(--mono);position:relative;z-index:2}.live{color:var(--teal)}.water-stage{position:absolute;inset:82px 30px 35px;border-radius:22px;background:linear-gradient(180deg,#163b49,#0b202b);overflow:hidden;border:1px solid rgba(255,255,255,.08)}.water-stage:before{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:58%;background:linear-gradient(180deg,rgba(193,101,46,.12),rgba(31,183,165,.12));animation:water 6s ease-in-out infinite}@keyframes water{50%{height:64%;transform:translateY(-8px)}}.rings{position:absolute;inset:0;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(85,234,213,.25);border-radius:50%;animation:ring 4s ease-out infinite}.ring:nth-child(1){width:90px;height:90px}.ring:nth-child(2){width:150px;height:150px;animation-delay:1.2s}.ring:nth-child(3){width:220px;height:220px;animation-delay:2.4s}@keyframes ring{0%{transform:scale(.65);opacity:0}20%{opacity:1}100%{transform:scale(1.18);opacity:0}}.core{width:68px;height:68px;border-radius:20px;background:rgba(85,234,213,.1);border:1px solid rgba(85,234,213,.5);display:grid;place-items:center;z-index:2;box-shadow:0 0 40px rgba(85,234,213,.16);animation:float 3.5s ease-in-out infinite}.core svg{width:30px}@keyframes float{50%{transform:translateY(-10px)}}.telemetry{position:absolute;left:20px;right:20px;bottom:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:4}.telemetry div{background:rgba(4,16,22,.72);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px}.telemetry small{display:block;color:var(--muted);font:9px var(--mono);text-transform:uppercase}.telemetry strong{display:block;margin-top:5px;font:600 19px var(--mono);color:var(--teal)}
section{padding:110px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:38px}.section-head h2{font-size:clamp(34px,5vw,54px);letter-spacing:-.035em}.section-head p{max-width:420px;color:var(--muted);line-height:1.65;font-size:14px}.grid{display:grid;gap:16px}.problem-grid{grid-template-columns:1.2fr .8fr}.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:25px;backdrop-filter:blur(15px);box-shadow:var(--shadow)}.problem-main{min-height:310px;position:relative;overflow:hidden}.problem-main h3{font-size:30px;max-width:580px}.problem-main p{color:var(--muted);line-height:1.7;max-width:600px;margin-top:16px}.problem-main .mini-label{position:absolute;right:24px;bottom:22px;color:var(--orange);font:10px var(--mono);text-transform:uppercase}.problem-side{display:grid;gap:16px}.stat{display:flex;justify-content:space-between;align-items:end;min-height:146px}.stat strong{font:600 40px var(--mono);color:var(--teal)}.stat span{color:var(--muted);font-size:12px;max-width:120px;text-align:right}
.sensor-grid{grid-template-columns:repeat(3,1fr)}.sensor{position:relative;overflow:hidden;min-height:190px;transition:.3s}.sensor:hover{transform:translateY(-5px);border-color:rgba(85,234,213,.35)}.sensor:after{content:"";position:absolute;right:-40px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(85,234,213,.07)}.sensor-tag{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.sensor h3{font:18px var(--body);margin-top:12px;font-weight:600}.reading{display:flex;align-items:baseline;gap:5px;margin-top:22px}.reading strong{font:600 31px var(--mono);color:var(--teal)}.reading span{font:11px var(--mono);color:var(--muted)}.meter{height:4px;border-radius:9px;background:#203c47;margin-top:14px;overflow:hidden}.meter i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--orange),var(--teal));animation:meter 3s ease-in-out infinite alternate}@keyframes meter{from{width:calc(var(--w) - 10%)}to{width:var(--w)}}
.flow-wrap{padding:25px;background:linear-gradient(145deg,rgba(16,46,59,.85),rgba(8,25,34,.8));border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}.flow:before{content:"";position:absolute;top:44px;left:9%;right:9%;height:1px;background:linear-gradient(90deg,var(--orange),var(--teal));opacity:.4}.flow-step{position:relative;text-align:center;z-index:2}.flow-icon{width:88px;height:88px;margin:auto;border-radius:22px;border:1px solid var(--line);background:#0c222d;display:grid;place-items:center;transition:.5s}.flow-step.active .flow-icon{border-color:var(--teal);box-shadow:0 0 30px rgba(85,234,213,.16);transform:translateY(-6px)}.flow-icon span{font:600 14px var(--mono);color:var(--teal)}.flow-step h3{font-size:16px;margin-top:15px}.flow-step p{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}.progress{height:3px;background:#1d3741;margin:35px auto 0;border-radius:5px;overflow:hidden;max-width:560px}.progress i{display:block;height:100%;width:25%;background:var(--teal);transition:width .7s ease}
.arch{display:grid;grid-template-columns:1fr 1fr;gap:16px}.arch-card{min-height:250px}.arch-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:25px}.node{padding:12px 15px;border:1px solid var(--line);background:#0c222d;border-radius:12px;font:11px var(--mono);color:var(--text)}.arrow{color:var(--teal);font-family:var(--mono)}.features{grid-template-columns:repeat(3,1fr)}.feature{min-height:155px}.feature b{font:500 11px var(--mono);color:var(--teal)}.feature h3{font-size:20px;margin:14px 0 8px}.feature p{font-size:12px;color:var(--muted);line-height:1.55}
.impact{position:relative;overflow:hidden;padding:34px}.impact-grid{display:grid;grid-template-columns:1.2fr repeat(3,.6fr);gap:14px;align-items:stretch}.impact h2{font-size:36px}.impact .intro{color:var(--muted);font-size:13px;line-height:1.6;margin-top:10px;max-width:450px}.impact-stat{border-left:1px solid var(--line);padding-left:22px;display:flex;flex-direction:column;justify-content:center}.impact-stat strong{font:600 32px var(--mono);color:var(--teal)}.impact-stat span{font-size:11px;color:var(--muted);margin-top:6px}.footer{padding:40px 0 60px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.footer-inner{display:flex;justify-content:space-between;gap:20px}.footer strong{color:var(--text)}
.reveal{opacity:0;transform:translateY(22px);animation:reveal 1s cubic-bezier(.2,.7,.2,1) forwards}.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}@keyframes reveal{to{opacity:1;transform:none}}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding-top:120px}.hero-panel{min-height:420px}.problem-grid,.arch{grid-template-columns:1fr}.sensor-grid,.features{grid-template-columns:repeat(2,1fr)}.impact-grid{grid-template-columns:1fr 1fr}.impact-grid>div:first-child{grid-column:1/-1}.impact-stat{border-left:0;border-top:1px solid var(--line);padding:18px 0 0}}
@media(max-width:650px){.container{width:min(100% - 30px,1180px)}.nav{top:10px;width:calc(100% - 20px)}.nav-links{display:none}.status{font-size:9px}.hero{padding-top:105px;gap:35px}.hero-panel{min-height:370px}.water-stage{inset:70px 18px 20px}.telemetry{grid-template-columns:1fr 1fr 1fr;left:10px;right:10px;bottom:10px}.telemetry div{padding:9px 8px}.telemetry strong{font-size:15px}.section-head{display:block}.section-head p{margin-top:13px}.sensor-grid,.features{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr);gap:25px}.flow:before{display:none}.flow-icon{width:74px;height:74px}.impact-grid{grid-template-columns:1fr}.impact-grid>div:first-child{grid-column:auto}.footer-inner{display:block}.footer-inner div+div{margin-top:8px}section{padding:80px 0}}

.water-transition{position:relative;margin-bottom:30px;padding:18px;border:1px solid var(--line);border-radius:20px;background:rgba(5,18,25,.72);overflow:hidden}.water-pipe{height:150px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(4,1fr);position:relative;background:#0a1d27}.water-chamber{position:relative;overflow:hidden;border-right:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#122f3b,#0a202a)}.water-chamber:last-of-type{border-right:0}.water-fill{position:absolute;left:-5%;right:-5%;bottom:0;height:100%;background:linear-gradient(180deg,#b9683c,#713c2d);transition:background 1s ease,filter 1s ease}.water-chamber:nth-child(2) .water-fill{background:linear-gradient(180deg,#8f7050,#536253)}.water-chamber:nth-child(3) .water-fill{background:linear-gradient(180deg,#4d9f91,#247f78)}.water-chamber:nth-child(4) .water-fill{background:linear-gradient(180deg,#63ead5,#159f95);filter:saturate(1.1)}.water-chamber.active-water{box-shadow:inset 0 0 0 1px rgba(85,234,213,.45)}.water-chamber.active-water .water-fill{animation:activeWater 1.8s ease-in-out infinite alternate}@keyframes activeWater{from{filter:brightness(.95)}to{filter:brightness(1.18)}}.water-wave{position:absolute;left:-50%;top:-8px;width:200%;height:18px;background:radial-gradient(ellipse at center,currentColor 0%,transparent 68%);background-size:34px 20px;opacity:.8;animation:waterWave 2.4s linear infinite}.water-chamber:nth-child(1) .water-wave{color:#d07a49}.water-chamber:nth-child(2) .water-wave{color:#9aa78d}.water-chamber:nth-child(3) .water-wave{color:#45bfb0}.water-chamber:nth-child(4) .water-wave{color:#9affee}.water-shimmer{position:absolute;inset:0;background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.1) 45%,transparent 65%);background-size:220% 220%;animation:waterShimmer 4.5s ease-in-out infinite}.water-label{position:absolute;top:12px;left:14px;z-index:4;font:10px var(--mono);letter-spacing:.08em;color:rgba(255,255,255,.7)}.water-status{position:absolute;bottom:12px;left:14px;z-index:4;font:10px var(--mono);color:#fff;opacity:.8}.water-bubbles{position:absolute;inset:0;z-index:5;pointer-events:none}.water-bubble{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#dffefa;opacity:.55;animation:bubbleRise 3.5s linear infinite}.water-bubble:nth-child(1){left:8%;animation-delay:.2s}.water-bubble:nth-child(2){left:19%;animation-delay:1.1s}.water-bubble:nth-child(3){left:31%;animation-delay:1.8s}.water-bubble:nth-child(4){left:44%;animation-delay:.7s}.water-bubble:nth-child(5){left:57%;animation-delay:2s}.water-bubble:nth-child(6){left:69%;animation-delay:1.3s}.water-bubble:nth-child(7){left:82%;animation-delay:.4s}.water-bubble:nth-child(8){left:91%;animation-delay:2.4s}@keyframes waterWave{from{transform:translateX(0)}to{transform:translateX(34px)}}@keyframes waterShimmer{0%{background-position:0% 0%}50%{background-position:100% 100%}100%{background-position:0% 0%}}@keyframes bubbleRise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.6}100%{transform:translateY(-145px) scale(1.1);opacity:0}}.water-caption{display:flex;justify-content:space-between;align-items:center;margin-top:13px;color:var(--muted);font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em}.water-caption strong{color:var(--teal);font-weight:500}.flow-wrap .flow{margin-top:8px}.flow-wrap .progress{margin-top:24px}@media(max-width:650px){.water-pipe{height:120px}.water-caption{font-size:9px}.water-status{font-size:8px}}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useEffect,useState}=React;

const sensors=[
 ['01','pH','7.1','pH',68],['02','TDS','210','ppm',42],['03','Turbidity','1.2','NTU',18],
 ['04','ORP','215','mV',58],['05','Flow rate','2.4','L/min',52],['06','Heavy metals','<0.01','mg/L',10]
];
const stages=[['01','SENSE','Live water parameters'],['02','THINK','Rule-based decision'],['03','TREAT','Adaptive purification'],['04','VERIFY','Output validation']];

function App(){
 const [stage,setStage]=useState(0);
 const [live,setLive]=useState({ph:7.1,tds:210,turb:1.2});
 useEffect(()=>{const t=setInterval(()=>setStage(s=>(s+1)%4),2200);return()=>clearInterval(t)},[]);
 useEffect(()=>{const t=setInterval(()=>setLive(v=>({ph:+(7.05+(Math.random()-.5)*.14).toFixed(2),tds:Math.round(205+Math.random()*18),turb:+(1.1+Math.random()*.4).toFixed(1)})),1800);return()=>clearInterval(t)},[]);
 return <>
  <nav className="nav"><a className="brand" href="#top">JAL <span>RAKSHAK</span></a><div className="nav-links"><a href="#problem">Problem</a><a href="#sense">Sense</a><a href="#flow">System</a><a href="#impact">Impact</a></div><div className="status"><i className="dot"/> SYSTEM ONLINE</div></nav>
  <main id="top">
   <section className="hero container">
    <div>
     <div className="kicker reveal">Team Hexora · SIH 2026</div>
     <h1 className="reveal d1">Cleaner water.<br/><em>Smarter decisions.</em></h1>
     <p className="hero-copy reveal d2">A solar-powered, sensor-driven system that detects, treats and verifies water quality in one closed loop.</p>
     <div className="hero-actions reveal d3"><a className="btn primary" href="#flow">Explore the system →</a><a className="btn secondary" href="#sense">Live parameters</a></div>
    </div>
    <div className="hero-panel reveal d3">
      <div className="panel-top"><span>JAL RAKSHAK / LIVE NODE</span><span className="live">● MONITORING</span></div>
      <div className="water-stage"><div className="rings"><i className="ring"/><i className="ring"/><i className="ring"/><div className="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M12 3S6 9.4 6 14a6 6 0 0 0 12 0c0-4.6-6-11-6-11Z"/><path d="M9 15c.4 1.4 1.5 2.2 3 2.5"/></svg></div></div>
       <div className="telemetry"><div><small>pH</small><strong>{live.ph}</strong></div><div><small>TDS</small><strong>{live.tds}</strong></div><div><small>Turbidity</small><strong>{live.turb}</strong></div></div>
      </div>
    </div>
   </section>

   <section id="problem"><div className="container"><div className="section-head"><div><div className="kicker">01 · The challenge</div><h2>Water can look<br/>safe — and still fail.</h2></div><p>Mining-affected sources can carry visible and invisible contamination. Rural communities need faster, local monitoring and treatment.</p></div>
    <div className="grid problem-grid"><div className="glass problem-main"><h3>From uncertain source → monitored output.</h3><p>Jal Rakshak combines sensing, decision logic, purification and verification instead of treating them as separate steps.</p><span className="mini-label">Closed-loop water safety</span></div><div className="problem-side"><div className="glass stat"><strong>6</strong><span>water-quality inputs monitored</span></div><div className="glass stat"><strong>4</strong><span>purification stages</span></div></div></div>
   </div></section>

   <section id="sense"><div className="container"><div className="section-head"><div><div className="kicker">02 · Sense</div><h2>Know the water<br/>before treating it.</h2></div><p>Compact sensor inputs create a live quality snapshot for the controller.</p></div>
    <div className="grid sensor-grid">{sensors.map(([n,name,val,unit,w],i)=><div className="glass sensor reveal" key={name} style={{animationDelay:(i*.08)+'s','--w':w+'%'}}><span className="sensor-tag">{n} / Sensor input</span><h3>{name}</h3><div className="reading"><strong>{name==='pH'?live.ph:name==='TDS'?live.tds:name==='Turbidity'?live.turb:val}</strong><span>{unit}</span></div><div className="meter"><i/></div></div>)}</div>
   </div></section>

   <section id="flow"><div className="container"><div className="section-head"><div><div className="kicker">03 · Closed loop</div><h2>Sense. Think. Treat.<br/>Verify.</h2></div><p>The system continuously cycles through the four core actions — automatically.</p></div>
    <div className="flow-wrap">
      <div className="water-transition">
       <div className="water-pipe">
        {[0,1,2,3].map(i=><div className={'water-chamber '+(stage===i?'active-water':'')} key={i}>
         <span className="water-label">0{i+1}</span>
         <div className="water-fill"><div className="water-wave"/></div>
         <div className="water-shimmer"/>
         <span className="water-status">{i===0?'RAW / DIRTY':i===1?'SETTLING':i===2?'FILTERED':'CLEAN / VERIFIED'}</span>
        </div>)}
        <div className="water-bubbles">{Array.from({length:8}).map((_,i)=><i className="water-bubble" key={i}/>)}</div>
       </div>
       <div className="water-caption"><span>Contaminated intake</span><strong>Automatic purification flow →</strong><span>Safe monitored output</span></div>
      </div>
      <div className="flow">{stages.map(([n,name,desc],i)=><div className={'flow-step '+(stage===i?'active':'')} key={name}><div className="flow-icon"><span>{n}</span></div><h3>{name}</h3><p>{desc}</p></div>)}</div><div className="progress"><i style={{width:((stage+1)*25)+'%'}}/></div></div>
   </div></section>

   <section><div className="container"><div className="section-head"><div><div className="kicker">04 · Treat</div><h2>Four focused<br/>treatment stages.</h2></div><p>Each stage targets a different part of the purification chain.</p></div>
    <div className="grid features"><div className="glass feature"><b>01 · PRE-FILTER</b><h3>Sedimentation</h3><p>Settles heavy particles and reduces incoming load.</p></div><div className="glass feature"><b>02 · CARBON</b><h3>Activated carbon</h3><p>Provides an additional filtration and adsorption layer.</p></div><div className="glass feature"><b>03 · ADSORPTION</b><h3>Heavy-metal filter</h3><p>Targets screened heavy-metal contamination risk.</p></div><div className="glass feature"><b>04 · DISINFECTION</b><h3>Chlorination</h3><p>Controlled dosing with monitored treatment status.</p></div><div className="glass feature"><b>OUTPUT</b><h3>Verify again</h3><p>Post-treatment readings confirm the system response.</p></div><div className="glass feature"><b>POWER</b><h3>Solar-ready</h3><p>Designed for operation where grid dependency is a constraint.</p></div></div>
